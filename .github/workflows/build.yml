name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs: { version: { description: "version", default: "2.0.0" } }

jobs:
  linux-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: build/ci.sh artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux-ci, path: artifacts/*.md }

  windows-package:
    runs-on: windows-latest
    needs: linux-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - shell: pwsh
        run: ./build/publish.ps1 -Version "${{ github.event.inputs.version || '2.0.0' }}"
      - run: choco install innosetup -y --no-progress
      - shell: pwsh
        run: iscc /DVersion="${{ github.event.inputs.version || '2.0.0' }}" build\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CheckBarcode-win-x64
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
